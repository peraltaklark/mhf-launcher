name: Android CI Bionic

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'ludashi-plus/4.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: "MHFZ Launcher Ludashi"
            app_id: "com.ludashi.benchmark"
            short: "ludashi"
          - name: "MHFZ Launcher Antutu"
            app_id: "com.antutu.ABenchMark"
            short: "antutu"
          - name: "MHFZ Launcher Genshin"
            app_id: "com.miHoYo.GenshinImpact"
            short: "genshin"
          - name: "MHFZ Launcher Naraka"
            app_id: "com.netease.l22"
            short: "naraka"
          - name: "MHFZ Launcher PUBG"
            app_id: "com.tencent.ig"
            short: "pubg"
          - name: "MHFZ Launcher AI Benchmark"
            app_id: "com.antutu.aibenchmark"
            short: "ai-benchmark"
          - name: "MHFZ Launcher"
            app_id: "com.mhfz.launcher"
            short: "mhfz"

    name: Build ${{ matrix.variant.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone libadrenotools specific commit
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git \
            app/src/main/cpp/adrenotools
          cd app/src/main/cpp/adrenotools
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass inside adrenotools
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PAPP_ID="${{ matrix.variant.app_id }}" \
            -PAPP_NAME="${{ matrix.variant.name }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHFZ-${{ matrix.variant.short }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rename APK for release
        run: |
          mkdir -p release-upload
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$SRC" "release-upload/MHFZ-${{ matrix.variant.short }}-${{ github.run_number }}.apk"
          ls -la release-upload/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated multi-variant build.
            Commit: ${{ github.sha }}
          files: release-upload/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
