name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'ludashi-plus/4.0'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: "MHFZ Launcher Ludashi"
            app_id: "com.ludashi.benchmark"
            short: "ludashi"
          - name: "MHFZ Launcher Antutu"
            app_id: "com.antutu.ABenchMark"
            short: "antutu"
          - name: "MHFZ Launcher Genshin"
            app_id: "com.miHoYo.GenshinImpact"
            short: "genshin"
          - name: "MHFZ Launcher Naraka"
            app_id: "com.netease.l22"
            short: "naraka"
          - name: "MHFZ Launcher PUBG"
            app_id: "com.tencent.ig"
            short: "pubg"
          - name: "MHFZ Launcher AI Benchmark"
            app_id: "com.antutu.aibenchmark"
            short: "ai-benchmark"
          - name: "MHFZ Launcher"
            app_id: "com.mhfz.launcher"
            short: "mhfz"

    name: Build ${{ matrix.variant.name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-26" \
                     "build-tools;35.0.0" \
                     "cmake;3.22.1" \
                     "ndk;29.0.14206865"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PAPP_ID="${{ matrix.variant.app_id }}" \
            -PAPP_NAME="${{ matrix.variant.name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MHFZ-${{ matrix.variant.short }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
